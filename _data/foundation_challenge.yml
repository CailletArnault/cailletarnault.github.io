en:
  intro: >-
    I lead and coordinate this challenge with <strong>Yneuro</strong>, alongside <strong>Inria</strong> and <strong>UC San Diego</strong>.
    <a href="https://www.linkedin.com/feed/update/urn:li:activity:7508171678452183041/">Launched in September 2026</a>,
    it concludes with the results presentation at the <a href="https://brainbodyfm-workshop.github.io/">Brain and Body Workshop</a> at NeurIPS in December 2026.
  scale: >-
    The largest neuroscience competition to date, it brings together
    <a href="https://www.linkedin.com/feed/update/urn:li:activity:7513943267806347264/">31 organizers</a> from 17 institutions across 5 countries.
    At the midpoint, <strong>2,500+ participants from 67 countries</strong> are competing.
  role: >-
    I coordinate planning, provide compute infrastructure with Yneuro, lead communications, and contribute to the scientific validation of the four tracks.
    Across (01) vision, (02) mental commands, (03) sleep, and (04) hand motion, we test whether models generalize across people, sessions, and devices: a fundamental step toward neurotechnology that works beyond the lab.
  stack_intro: >-
    The challenge builds on an <a href="https://neural-interfaces26.github.io/ecosystem.html">open-source ecosystem</a>
    for neurophysiological data, models, reproducible benchmarks, and evaluation.
  stack_label: Open-source tools
  image_alt: "EEG/EMG Foundation Challenge 2026 launch: four decoding tracks"
  ecosystem_alt: "Challenge organizers: 31 people, 17 institutions, 5 countries, coordinated by Yneuro"
  details: Track details
  video: Watch introduction
  website: Competition website

fr:
  intro: >-
    Je pilote et coordonne cette compétition avec <strong>Yneuro</strong>, aux côtés d’<strong>Inria</strong> et d’<strong>UC San Diego</strong>.
    <a href="https://www.linkedin.com/feed/update/urn:li:activity:7508171678452183041/">Lancée en septembre 2026</a>,
    elle s’achève par la présentation des résultats au <a href="https://brainbodyfm-workshop.github.io/">Brain and Body Workshop</a> de NeurIPS en décembre 2026.
  scale: >-
    La plus grande compétition de neurosciences organisée à ce jour réunit
    <a href="https://www.linkedin.com/feed/update/urn:li:activity:7513943267806347264/">31 organisateurs</a> issus de 17 institutions dans 5 pays.
    À mi-parcours, elle rassemble <strong>plus de 2 500 participants de 67 pays</strong>.
  role: >-
    J’assure la planification, la mise à disposition des moyens de calcul avec Yneuro et la communication, et je contribue à la validation scientifique des quatre épreuves.
    À travers (01) la vision, (02) les commandes mentales, (03) le sommeil et (04) les mouvements de la main, nous évaluons la capacité des modèles à généraliser entre personnes, sessions et dispositifs, une condition essentielle pour déployer les neurotechnologies hors du laboratoire.
  stack_intro: >-
    La compétition s’appuie sur un <a href="https://neural-interfaces26.github.io/ecosystem.html">écosystème open source</a>
    de données neurophysiologiques, de modèles, de benchmarks reproductibles et d’outils d’évaluation.
  stack_label: Outils open source
  image_alt: "Lancement du EEG/EMG Foundation Challenge 2026 : quatre épreuves de décodage"
  ecosystem_alt: "Les organisateurs : 31 personnes, 17 institutions, 5 pays, sous la coordination de Yneuro"
  details: Voir l’épreuve
  video: Présentation vidéo
  website: Site de la compétition

