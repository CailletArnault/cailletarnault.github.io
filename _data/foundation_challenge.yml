tracks:
  - number: "01"
    title: EEG-to-Image
    team: Meta FAIR Brain & AI + Alljoined
    image: /assets/images/opensource/eeg-to-img.png
    url: https://neural-interfaces26.github.io/tracks.html#track-1
    video: https://www.linkedin.com/posts/hubertbanville_can-we-tell-what-someone-is-seeing-from-their-ugcPost-7508897415551266816-XT57/
    en: Identify viewed images from EEG.
    fr: Identifier une image à partir de l’EEG.
  - number: "02"
    title: BCI Decoding
    team: Inria + LaBRI + ISAE-SUPAERO
    image: /assets/images/opensource/bci-track.png
    url: https://neural-interfaces26.github.io/tracks.html#track-2
    video: https://www.linkedin.com/posts/simon-kojima-760948128_can-a-brain-computer-interface-trained-today-ugcPost-7508489161662951424-BfVA/
    en: Decode mental commands across EEG sessions.
    fr: Décoder des commandes mentales d’une session EEG à l’autre.
  - number: "03"
    title: Sleep Onset
    team: Muse by Interaxon
    image: /assets/images/opensource/sleep_prediction.png
    url: https://neural-interfaces26.github.io/tracks.html#track-3
    video: https://www.linkedin.com/posts/mauriceaj_eeg-neurofeedback-neuroscience-ugcPost-7509249894444961793-RnIz/
    en: Predict sleep onset from wearable EEG.
    fr: Prédire l’endormissement à partir d’un bandeau EEG.
  - number: "04"
    title: EMG-to-Pose
    team: Meta Reality Labs + Imperial
    image: /assets/images/opensource/emg-to-pose.png
    url: https://neural-interfaces26.github.io/tracks.html#track-4
    video: https://www.linkedin.com/posts/alexandregramfort_neurips2026-emg-neuralinterfaces-ugcPost-7507745588227088385-YOIV/
    en: Reconstruct hand movements from wrist EMG.
    fr: Reconstruire les mouvements de la main à partir de l’EMG du poignet.
